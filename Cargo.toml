[workspace]
resolver = "2"
members = [
    "wjj-std",
    "wjj-std-core",
    "wjj-std-macros",
    "wjj-std-examples",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["wjj"]
repository = "https://github.com/tpxxwz/wjj-std"
rust-version = "1.85"

[workspace.dependencies]
# 内部依赖（版本自动继承 workspace.package.version）
wjj-std-core = { path = "wjj-std-core" }
wjj-std-macros = { path = "wjj-std-macros" }

# 过程宏依赖
quote = "1.0.44"
syn = { version = "2.0.114", features = ["full"] }
proc-macro2 = "1.0.106"

# 核心依赖
serde = "1.0.228"
serde_json = "1.0.149"
linkme = "0.3.35"
ctor = "0.6.3"
minijinja = "2.14.0"
once_cell = "1.21.3"

# 可选功能依赖
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.83"
