[package]
name = "wjj-std"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WJJ's standard library for Rust projects - A comprehensive toolkit with error handling, utilities, and more"
keywords = ["error", "utility", "std", "toolkit"]
categories = ["development-tools"]

[dependencies]
# 内部依赖
wjj-std-core = { path = "../wjj-std-core", default-features = false }
wjj-std-macros = { path = "../wjj-std-macros" }

# 宏生成的代码需要这些依赖
serde_json = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }

# 可选依赖
tokio = { workspace = true, optional = true }

[features]
default = []  # 用户明确选择需要的功能

# 功能模块（传递给 core）
error = ["wjj-std-core/error", "dep:serde_json", "dep:linkme"]  # 错误处理模块（当前已实现）
app = ["wjj-std-core/app", "dep:tokio"]                          # 应用框架模块（当前已实现）
string = ["wjj-std-core/string"]                                # 字符串工具（预留）
http = ["wjj-std-core/http"]                                    # HTTP 工具（预留）
json = ["wjj-std-core/json"]                                    # JSON 工具（预留）
time = ["wjj-std-core/time"]                                    # 时间工具（预留）

# 全功能
full = ["error", "app", "string", "http", "json", "time"]
