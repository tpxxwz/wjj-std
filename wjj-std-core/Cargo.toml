[package]
name = "wjj-std-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core implementation for wjj-std"

[lib]
crate-type = ["rlib"]

[features]
default = []

# Error handling module
error = ["dep:linkme", "dep:ctor", "dep:minijinja", "dep:once_cell", "dep:serde_json"]

# Application framework module
app = ["dep:tokio", "dep:async-trait"]

# Future modules (placeholder)
string = []
http = []
json = []
time = []

# All features
full = ["error", "app", "string", "http", "json", "time"]

[dependencies]
# Optional dependencies for error feature
linkme = { workspace = true, optional = true }
ctor = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Optional dependencies for app feature
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
